name: train_model

# Rebuild features, train, validate against documented real events, publish to the model
# registry, then batch-score the latest data. Every step is offline-testable; the runs
# here only add the Hub and the serving database.
on:
  schedule:
    - cron: "0 6 * * 1"   # weekly, after the transform
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Train and validate, but do not publish or score"
        type: boolean
        default: false
      require_known_events:
        description: "Fail the run if a documented real event is missed"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: train-model
  cancel-in-progress: false

jobs:
  train:
    name: train, validate, publish, score
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "requirements/*.lock"

      - name: Install
        run: uv pip install --system --no-deps -r requirements/ml.lock -e .

      - name: Mirror the bronze lake
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_NAMESPACE: ${{ secrets.HF_NAMESPACE }}
          HF_BRONZE_REPO: ${{ secrets.HF_NAMESPACE }}/TerraSentinel
        run: python -m tools.sync_bronze --local-dir data/bronze_hf

      - name: Resolve the lake revision for lineage
        id: lake
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_NAMESPACE: ${{ secrets.HF_NAMESPACE }}
        run: |
          sha=$(python -c "
          from collectors.config import hf_repo
          from storage.hf_dataset_reader import HFDatasetReader
          print(HFDatasetReader(repo_id=hf_repo('bronze')).commit_sha())
          ")
          echo "commit=$sha" >> "$GITHUB_OUTPUT"
          echo "training on bronze revision $sha"

      - name: dbt build (features depend on the gold marts)
        run: |
          set -euo pipefail
          python -m tools.bronze_manifest \
            --local-root data/bronze_hf --root data/bronze_hf \
            --out transform/target/bronze_globs.json \
            --emit-exclude transform/target/dbt_exclude.txt \
            --allow-missing > /dev/null
          python - <<'PYEOF' > transform/target/dbt_vars.json
          import json
          globs = json.load(open("transform/target/bronze_globs.json"))
          print(json.dumps({"bronze_root": "data/bronze_hf", "bronze_globs": globs}))
          PYEOF
          # A source that was never backfilled fails its own staging model. Left
          # unexcluded, that one failure skips the whole build — including the sync that
          # publishes the marts which ARE ready. Excluding the absent branch keeps the
          # failure to itself and the workflow still lands the data it has.
          EXCLUDE="$(cat transform/target/dbt_exclude.txt 2>/dev/null || true)"
          if [ -n "$EXCLUDE" ]; then
            echo "excluding absent sources: $EXCLUDE"
            dbt build \
              --project-dir transform --profiles-dir transform \
              --vars "$(cat transform/target/dbt_vars.json)" \
              --exclude $EXCLUDE \
              --no-partial-parse
          else
            dbt build \
              --project-dir transform --profiles-dir transform \
              --vars "$(cat transform/target/dbt_vars.json)" \
              --no-partial-parse
          fi

      - name: Train and validate
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: |
          # Decided in shell: a GitHub expression like `inputs.X != false` coerces a null
          # input unpredictably between scheduled and manual runs, and the failure mode is
          # a retrain that silently skips the validation gate.
          ARGS="--require-known-events"
          if [ "${{ inputs.require_known_events }}" = "false" ]; then
            ARGS=""
          fi
          python -m ml.train.train_isolation_forest \
            --duckdb-path transform/terrasentinel.duckdb \
            --out-dir ml/artifacts/isolation_forest_fire \
            --dataset-commit "${{ steps.lake.outputs.commit }}" \
            $ARGS

      - name: Publish to the model registry
        if: ${{ !inputs.dry_run }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_NAMESPACE: ${{ secrets.HF_NAMESPACE }}
        run: |
          python -m ml.registry.push_model_to_hf \
            --bundle-dir ml/artifacts/isolation_forest_fire

      - name: Batch-score the latest data into the serving database
        id: score
        if: ${{ !inputs.dry_run }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_NAMESPACE: ${{ secrets.HF_NAMESPACE }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          python -m ml.scoring.batch_score \
            --duckdb-path transform/terrasentinel.duckdb \
            --model-dir ml/artifacts/isolation_forest_fire \
            --out ml/artifacts/predictions.parquet | tee /tmp/score.json

      - name: Record the run
        # Requirement: every workflow writes a pipeline_runs row, which is what the
        # dashboard's freshness view and /api/health read. `if: always()` so a failed
        # retrain is recorded too — a run that stopped happening is exactly what the
        # health view exists to surface.
        if: always()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_NAMESPACE: ${{ secrets.HF_NAMESPACE }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          ROWS=$(python -c "
          import json, pathlib
          path = pathlib.Path('/tmp/score.json')
          try:
              text = path.read_text()
              print(json.loads(text[text.index('{'):]).get('rows_scored', 0))
          except Exception:
              print(0)
          " 2>/dev/null || echo 0)
          STATUS="success"
          if [ "${{ job.status }}" = "failure" ]; then STATUS="failed"; fi
          python -m ops.pipeline_run \
            --workflow train_model --status "$STATUS" --rows "$ROWS" --skip-hf \
            --details '{"model_dir":"ml/artifacts/isolation_forest_fire"}'

      - name: Upload training artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: model-artifacts
          path: |
            ml/artifacts/
            ml/runs/
          retention-days: 14
          if-no-files-found: ignore

      - name: Alert on failure
        if: failure()
        continue-on-error: true
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          python -m pip install --quiet --disable-pip-version-check requests==2.34.2
          python -m ops.notify  --message "train_model failed (${{ github.event_name }})"
