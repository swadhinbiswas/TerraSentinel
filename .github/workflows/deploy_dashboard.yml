name: deploy_dashboard

# Optional: Cloudflare Pages can auto-deploy straight from git. This workflow exists
# for teams who want the deploy *gated* behind CI — a broken type check or a failing
# model validation should stop a deploy, not land on the dashboard afterwards.
on:
  push:
    branches: [main]
    paths:
      - "serving/dashboard/**"
      - ".github/workflows/deploy_dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-dashboard
  cancel-in-progress: true

jobs:
  deploy:
    name: build + deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: serving/dashboard/package-lock.json

      - name: Install
        working-directory: serving/dashboard
        run: npm ci --no-audit --no-fund

      - name: Type-check and build
        working-directory: serving/dashboard
        run: |
          npx astro check
          npx astro build

      - name: Check for Cloudflare credentials
        # `secrets` cannot be referenced directly in an `if:` conditional — doing so
        # evaluates to empty and silently skips the step, which would look exactly like a
        # successful build that never deployed. A step-level env var is the documented
        # workaround, and this step makes the skip visible instead of quiet.
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "have_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_creds=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN is not set — build verified, deploy skipped"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.have_creds == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: serving/dashboard
          command: pages deploy dist --project-name=terrasentinel-dashboard
          # Turso credentials live in the Pages dashboard as encrypted environment
          # variables, not here: this file is committed, and a secret in it is a leak.

      - name: Alert on failure
        if: failure()
        continue-on-error: true
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          python -m pip install --quiet --disable-pip-version-check requests
          python -m ops.notify --message "deploy_dashboard failed on ${{ github.ref_name }}"
