name: ci

# Tests need no credentials: every external service is mocked at the HTTP layer,
# so a fork or a first-time clone can run the whole suite green.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "requirements/*.lock"

      - name: Install (dev + transform + ml), pinned by requirements/ci.lock
        # `--no-deps` everywhere: the lock is the complete, reviewed dependency
        # set. Installing `-e .[extras]` would re-resolve at job time, so a fresh
        # PyPI release could change what CI actually tests.
        run: uv pip install --system --no-deps -r requirements/ci.lock -e .

      - name: Lint
        run: ruff check .

      - name: Unit + integration tests
        run: python -m pytest tests/ -q --cov --cov-report=term-missing:skip-covered

      - name: dbt seeds must match the Python region registry
        run: python -m tools.export_seeds --check

      - name: Generate synthetic bronze with known injected anomalies
        run: python -m tools.synthetic_bronze --out data/bronze --clean --inject-anomaly

      - name: Enumerate the synthetic lake
        # Same code path the production transform uses, so a regression in glob
        # selection fails here rather than in the nightly job. `--allow-missing`
        # because the synthetic lake does not cover every registered source
        # (entsoe has no staging model yet, so nothing reads its globs): a
        # *staged* source with no files still fails the dbt build below, loudly.
        run: |
          python -m tools.bronze_manifest \
            --local-root data/bronze --root data/bronze \
            --out transform/target/bronze_globs.json \
            --allow-missing
          python -c "
          import json
          globs = json.load(open('transform/target/bronze_globs.json'))
          print(json.dumps({'bronze_root': 'data/bronze', 'bronze_globs': globs}))
          " > transform/target/dbt_vars.json

      - name: dbt build (models + schema tests) against the synthetic lake
        run: |
          dbt build \
            --project-dir transform --profiles-dir transform \
            --vars "$(cat transform/target/dbt_vars.json)" \
            --no-partial-parse

      - name: Unity Catalog DDL/MERGE must match GOLD_TABLES (generated)
        # Same freshness gate as export_seeds: the committed
        # databricks/sql/gold_ddl.sql must equal what this build regenerates,
        # so editing a mart model without regenerating the SQL fails here —
        # before the Databricks merge job could ever see a stale schema.
        run: python -m tools.export_uc_ddl --check

      - name: Injected anomalies must be detected
        run: python -m tools.assert_anomalies_detected --duckdb-path transform/terrasentinel.duckdb

      - name: Train and validate on the synthetic lake
        # The known-events gate is deliberately NOT applied here: those are real,
        # dated events and this lake is synthetic. The offline gate is the injected
        # anomaly check above; the real-event regression runs against real data in
        # train_model.yml. The check still runs and reports, so a catastrophic
        # regression is visible in the CI log.
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: |
          python -m ml.train.train_isolation_forest \
            --duckdb-path transform/terrasentinel.duckdb \
            --out-dir ml/artifacts/ci \
            --dataset-commit "ci-${{ github.sha }}"
          python -m tools.assert_known_events_reported --out-dir ml/artifacts/ci

      - name: Batch scoring shapes predictions without a database
        run: |
          python -m ml.scoring.batch_score \
            --duckdb-path transform/terrasentinel.duckdb \
            --model-dir ml/artifacts/ci \
            --out ml/artifacts/ci/predictions.parquet \
            --dry-run

      - name: Gold sync must shape a payload without a database
        run: python -m sync.push_gold_to_turso --duckdb-path transform/terrasentinel.duckdb --dry-run

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: serving/dashboard/package-lock.json

      - name: Dashboard build (type-checked, no credentials needed)
        # `astro check` is the gate that matters here: it caught a `class` vs
        # `className` mistake on React islands (silently dropping every style) and a
        # call site left on an old function signature.
        working-directory: serving/dashboard
        run: |
          npm ci --no-audit --no-fund
          npx astro check
          npx astro build

      - name: Collectors fail closed on a missing credential
        run: |
          python -c "
          from collectors.config import MissingCredential, preflight_sources
          try:
              preflight_sources(['firms'])
          except MissingCredential as exc:
              assert 'FIRMS_MAP_KEY' in str(exc), exc
              print('preflight correctly refused to start without credentials')
          else:
              raise SystemExit('preflight should have failed without FIRMS_MAP_KEY')
          "

      - name: Alert on failure
        if: failure()
        continue-on-error: true
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          python -m pip install --quiet --disable-pip-version-check requests==2.34.2
          python -m ops.notify --message "ci failed (${{ github.workflow }} on ${{ github.ref_name }})"
