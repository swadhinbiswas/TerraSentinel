name: backfill_historical

# One-time historical pull. Run this BEFORE the live collectors are scheduled:
# anomaly detection compares "now" against a seasonal baseline, so without this
# history the first anomaly scores are noise.
#
# Idempotent by design — partitions are keyed by observation period, so re-running
# a window overwrites the same paths rather than duplicating rows.
on:
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma list of sources, or 'all'"
        type: string
        default: all
      start_date:
        description: "Inclusive start date (YYYY-MM-DD). Blank = today minus 730 days."
        type: string
        default: ""
      end_date:
        description: "Inclusive end date (YYYY-MM-DD). Blank = today."
        type: string
        default: ""
      regions:
        description: "Comma list of region ids, or 'all'"
        type: string
        default: all
      plan_only:
        description: "Only print the request plan (no API calls, no writes)"
        type: boolean
        default: false
      dry_run:
        description: "Fetch and validate, write locally, skip the HF upload"
        type: boolean
        default: false
      include_climatology:
        description: "Also pull the static NSIDC 1981-2010 baseline"
        type: boolean
        default: true
      max_requests:
        description: "Per-source request cap"
        type: number
        default: 5000

permissions:
  contents: read

concurrency:
  group: backfill-historical
  cancel-in-progress: false

jobs:
  plan:
    name: request plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uv pip install --system -e .
      - name: Plan
        run: |
          python -m collectors.backfill_historical \
            --sources "${{ inputs.sources }}" \
            --regions "${{ inputs.regions }}" \
            ${{ inputs.start_date && format('--start-date {0}', inputs.start_date) || '' }} \
            ${{ inputs.end_date && format('--end-date {0}', inputs.end_date) || '' }} \
            --plan

  backfill:
    name: backfill ${{ matrix.source }}
    if: ${{ !inputs.plan_only }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        source: [firms, sentinel, noaa_nsidc]
    steps:
      - name: Skip sources that were not requested
        id: gate
        env:
          REQUESTED: ${{ inputs.sources }}
          SOURCE: ${{ matrix.source }}
        run: |
          if [ "$REQUESTED" = "all" ] || [ -z "$REQUESTED" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif echo ",$REQUESTED," | grep -q ",$SOURCE,"; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.enabled == 'true'

      - uses: actions/setup-python@v7
        if: steps.gate.outputs.enabled == 'true'
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        if: steps.gate.outputs.enabled == 'true'
        with:
          enable-cache: true

      - name: Install
        if: steps.gate.outputs.enabled == 'true'
        run: |
          case "${{ matrix.source }}" in
            sentinel)   EXTRAS="[gee]" ;;
            noaa_nsidc) EXTRAS="[noaa]" ;;
            *)          EXTRAS="" ;;
          esac
          uv pip install --system -e ".${EXTRAS}"

      - name: Materialise GEE service account
        if: steps.gate.outputs.enabled == 'true' && matrix.source == 'sentinel'
        env:
          GEE_SA_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GEE_SA_JSON" ]; then
            echo "::error::GEE_SERVICE_ACCOUNT_JSON secret is not set"
            exit 1
          fi
          umask 077
          printf '%s' "$GEE_SA_JSON" > "$RUNNER_TEMP/gee-service-account.json"
          echo "GEE_SERVICE_ACCOUNT_JSON=$RUNNER_TEMP/gee-service-account.json" >> "$GITHUB_ENV"

      - name: Backfill
        if: steps.gate.outputs.enabled == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_NAMESPACE: ${{ secrets.HF_NAMESPACE }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          GEE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GEE_SERVICE_ACCOUNT_EMAIL }}
          GEE_PROJECT: ${{ secrets.GEE_PROJECT }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          python -m collectors.backfill_historical \
            --sources "${{ matrix.source }}" \
            --regions "${{ inputs.regions }}" \
            --max-requests "${{ inputs.max_requests }}" \
            ${{ inputs.start_date && format('--start-date {0}', inputs.start_date) || '' }} \
            ${{ inputs.end_date && format('--end-date {0}', inputs.end_date) || '' }} \
            ${{ inputs.include_climatology && '--include-climatology' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            --log-json

      - name: Upload logs
        if: always() && steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: backfill-logs-${{ matrix.source }}
          path: |
            data/bronze
          retention-days: 7
          if-no-files-found: ignore

      - name: Alert on failure
        if: failure() && steps.gate.outputs.enabled == 'true'
        continue-on-error: true
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          python -m pip install --quiet --disable-pip-version-check requests
          python -m ops.notify \
            --message "backfill_historical failed for ${{ matrix.source }}" \
            --context '{"source":"${{ matrix.source }}","regions":"${{ inputs.regions }}"}'
