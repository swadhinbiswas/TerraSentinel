# dbt profile for TerraSentinel.
#
# DuckDB is an in-process library, so there is no server to configure: `dbt run`
# creates the .duckdb file on first use and every model is a schema inside it.
# httpfs is what lets DuckDB read parquet straight from the Hub with no download
# step — see docs/adr/0001-duckdb-over-spark.md.
#
# Credentials come from the environment only:
#   HF_BRONZE_REPO   swadhinbiswas/TerraSentinel
#   HF_TOKEN         only needed if the bronze repo is private
#
# Run dbt from the REPOSITORY ROOT so every relative path below is cwd-stable:
#   dbt build --project-dir transform --profiles-dir transform \
#             --vars '{"bronze_root": "data/bronze"}'

terrasentinel:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', 'transform/terrasentinel.duckdb') }}"
      schema: main
      threads: 4
      extensions:
        - httpfs
      settings:
        # Keep memory bounded so the same profile works on a 7GB Actions runner.
        memory_limit: "2GB"
        preserve_insertion_order: false

    # Databricks Workflows (databricks/jobs/run_dbt.py): identical engine and
    # tuning to `dev` — only the database file's location differs. The DuckDB
    # file lives on a Unity Catalog Volume so both tasks of the transform job
    # (run_dbt writes it, merge_gold reads it) see the same path; the bundle
    # sets DATABRICKS_DUCKDB_PATH from its uc_catalog/uc_schema/pipeline vars,
    # and the default below is those variables' default value.
    databricks:
      type: duckdb
      path: "{{ env_var('DATABRICKS_DUCKDB_PATH', '/Volumes/terrasentinel/gold/pipeline/terrasentinel.duckdb') }}"
      schema: main
      threads: 4
      extensions:
        - httpfs
      settings:
        memory_limit: "2GB"
        preserve_insertion_order: false
