[project]
name = "terrasentinel"
version = "0.1.0"
description = "Climate & satellite anomaly detection pipeline: free-tier ingestion, dbt+DuckDB transforms, unsupervised ML, edge-served dashboard."
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2,<3",
    "pyarrow>=17",
    "pandera>=0.20",
    "h3>=4.1",
    "python-dotenv>=1.0",
    "huggingface_hub>=0.26",
]

[project.optional-dependencies]
#: Live Sentinel-2 / Sentinel-1 collection via Google Earth Engine
gee = ["earthengine-api>=1.3"]
#: NOAA gridded products over OPeNDAP (OISST daily SST anomaly)
noaa = ["pydap>=3.4"]
#: dbt + DuckDB transform layer
transform = ["dbt-core>=1.10", "dbt-duckdb>=1.10", "duckdb>=1.1"]
#: ML layer
ml = ["scikit-learn>=1.5", "joblib>=1.4", "numpy>=1.26"]
ml-torch = ["torch>=2.4", "numpy>=1.26"]
ml-tracking = ["mlflow>=2.16"]
drift = ["evidently>=0.6"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "responses>=0.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collectors", "storage", "ops", "pandera_schemas", "ml", "sync"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["serving"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PTH", "T20", "ARG"]
ignore = [
    "E501",
    "B008",
    "ARG001",
    "ARG002",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "T20", "SIM117", "C408"]
"ml/*" = ["T20"]
"ml/*/*" = ["T20"]
"collectors/*" = ["T20"]
"ops/*" = ["T20"]
"tools/*" = ["T20"]
"sync/*" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: test hits a real external API (deselected by default)",
    "slow: long-running test",
]

[tool.coverage.run]
source = ["collectors", "storage", "ops", "ml", "sync", "pandera_schemas"]
omit = ["tests/*", "*/__init__.py"]
